<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="日本人が聞き分けにくい英語の音を練習する3択発音クイズ" />
    <title>Sound Check — 英語の発音クイズ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand" aria-label="Sound Check">
        <span class="brand-mark" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i>
        </span>
        <span lang="en">Sound Check</span>
      </div>
      <div class="header-actions">
        <div class="streak" aria-label="連続正解数">
          <span aria-hidden="true">🔥</span>
          <strong id="streakCount" aria-live="polite">0</strong>
          <span>連続</span>
        </div>
        <button class="icon-button" id="settingsButton" type="button" aria-label="音声設定を開く">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z" />
            <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.12 2.12-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.55V20.3h-3v-.09a1.7 1.7 0 0 0-1.03-1.55A1.7 1.7 0 0 0 8.8 19l-.06.06-2.12-2.12.06-.06A1.7 1.7 0 0 0 7.02 15a1.7 1.7 0 0 0-1.55-1.03h-.09v-3h.09A1.7 1.7 0 0 0 7.02 9.9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.12-2.12.06.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 1.03-1.55V4.6h3v.09a1.7 1.7 0 0 0 1.03 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.12 2.12-.06.06a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.55 1.03h.09v3h-.09A1.7 1.7 0 0 0 19.4 15Z" />
          </svg>
        </button>
      </div>
    </header>

    <main>
      <section class="intro">
        <p class="eyebrow" lang="en">LISTENING PRACTICE</p>
        <h1>聞こえた単語は<br /><em>どれ？</em></h1>
        <p class="lead">日本人が迷いやすい英語の音を、短い文の中で聞き分けよう。</p>
      </section>

      <section class="quiz-card" aria-labelledby="questionHeading">
        <div class="quiz-topline">
          <span id="questionCounter">QUESTION 1 / 8</span>
          <div class="progress-track" aria-hidden="true"><span id="progressBar"></span></div>
          <span id="scoreDisplay">0 PTS</span>
        </div>

        <div class="listen-area">
          <div class="pulse-ring">
            <button class="play-button" id="playButton" type="button" aria-label="問題の音声を再生">
              <svg class="play-icon" viewBox="0 0 32 32" aria-hidden="true">
                <path d="m11.5 8.2 12.2 7.3a.6.6 0 0 1 0 1L11.5 23.8a.6.6 0 0 1-.9-.5V8.7a.6.6 0 0 1 .9-.5Z" />
              </svg>
              <svg class="pause-icon" viewBox="0 0 32 32" aria-hidden="true">
                <path d="M10 9h4v14h-4zM18 9h4v14h-4z" />
              </svg>
            </button>
          </div>
          <p class="listen-label"><span class="natural-badge">NATURAL VOICE</span> タップして音声を聞く</p>
          <button class="slow-button" id="slowButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Zm4.5 4.2a4 4 0 0 1 0 5.6M18 6.7a7.5 7.5 0 0 1 0 10.6" /></svg>
            ゆっくり再生
          </button>
        </div>

        <div class="question-copy">
          <p id="contrastLabel" class="contrast-label">母音を聞き分けよう</p>
          <h2 id="questionHeading">聞こえた単語を選んでください</h2>
          <p class="sentence" id="sentenceDisplay">“I heard her say <span>___</span> clearly.”</p>
        </div>

        <div class="choices" id="choices" role="group" aria-label="回答の選択肢"></div>

        <div class="feedback" id="feedback" role="status" aria-live="polite">
          <div class="feedback-icon"></div>
          <div>
            <strong id="feedbackTitle"></strong>
            <p id="feedbackText"></p>
          </div>
        </div>

        <div class="quiz-actions">
          <button class="retry-button" id="retryButton" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.6M4 4v4.6h4.6" /></svg>
            もう一度
          </button>
          <button class="next-button" id="nextButton" type="button">
            次の問題へ
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
          </button>
        </div>
      </section>

      <p class="hint"><kbd>Space</kbd> で再生　<span>·</span>　<kbd>1</kbd>〜<kbd>3</kbd> で回答</p>
    </main>

    <dialog class="settings-dialog" id="settingsDialog">
      <form method="dialog">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow" lang="en">AUDIO SETTINGS</p>
            <h2>音声設定</h2>
          </div>
          <button class="icon-button close-button" id="closeSettingsButton" type="button" aria-label="閉じる">×</button>
        </div>
        <label>
          予備の英語音声
          <select id="voiceSelect"></select>
        </label>
        <label>
          予備音声の再生速度
          <span id="rateValue">0.85×</span>
          <input id="rateRange" type="range" min="0.6" max="1.1" value="0.85" step="0.05" />
        </label>
        <p class="dialog-note">通常は収録済みのナチュラル音声を再生します。上記設定は、音声ファイルを読み込めない場合に使用されます。</p>
        <button class="save-button" id="doneSettingsButton" type="button">閉じる</button>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
